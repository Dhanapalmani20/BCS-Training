<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      :root {
        /* 1rem = 16px */
        font-size: 16px;
      }

      section {
        /* 2rem = 32px */
        font-size: 2rem;
      }

      div {
        /* 2 * 32px = 64px */
        font-size: 2em;
      }

      p {
        /* 2 * 64px = 128px  */
        font-size: 2em;
      }
    </style>
  </head>
  <body>
    <section>
      <div>
        <p>This is awesome</p>
      </div>
    </section>
  </body>
</html>
