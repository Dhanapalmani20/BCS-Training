<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      ul {
        list-style: circle;
        /* list-style: none; */
      }

      ol {
        list-style: auto;
      }

      h3 {
        /* color: orange; */
        font-size: 2rem;
      }

      .fa-chess {
        color: purple;
      }

      .fa-basketball {
        color: brown;
      }
    </style>
  </head>
  <body>
    <h3>Hobbies</h3>
    <!-- Unordered list -->
    <!-- li - list item -->

    <ul>
      <li>Chess</li>
      <li>
        Cricket
        <ol>
          <li>Sachein</li>
          <li>MSD</li>
          <li>Kholi</li>
        </ol>
      </li>
      <li>Gaming</li>
      <li>Badminton</li>
      <li>Reading</li>
    </ul>

    <h3><i class="fa-solid fa-basketball"></i> Hobbies</h3>

    <!-- Ordered list 1., 2.-->
    <!-- li - list item -->

    <ol start="10" reversed>
      <li><i class="fa-solid fa-chess"></i>Chess</li>
      <li>
        <i class="fa-solid fa-basketball"></i>Cricket

        <ol>
          <li>Sachein</li>
          <li>MSD</li>
          <li>Kholi</li>
        </ol>
      </li>
      <li>Gaming</li>
      <li>Badminton</li>
      <li>Reading</li>
    </ol>
  </body>
</html>
