<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      /* CSS nesting */
      /* header > h2 {
        
      } */

      /* header  h2 {

      .main-container {
        /* Child */
        > h2 {
          color: orange;
        }

        /* Descendant */
        ol {
          list-style: none;
          a {
            text-decoration: none;
          }
        }

        button {
          background: skyblue;
        }
      }
    </style>

      <ol>

      <button class="cta-btn">Get Started</button>
    </header>
