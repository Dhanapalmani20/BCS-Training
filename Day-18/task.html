<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=
    , initial-scale=1.0"
    />
    <title>Document</title>
  </head>
  <body>
    <!-- Task 2.1 -->
    <h2>Hobbies</h2>
    <ul class="hobbies-container"></ul>

    <script>
      const hobbies = [
        "📚 Reading",
        "🎨 Painting",
        "📸 Photography",
        "🥾 Hiking",
        "🌱 Gardening",
        "👨‍🍳 Cooking",
        "🎶 Playing musical instruments",
        "💃 Dancing",
        "✈️ Traveling",
        "🧶 Knitting",
      ];

      for (let i = 0; i < hobbies.length; i++) {
        const list = document.createElement("li");
        list.innerText = hobbies[i];
        document.querySelector(".hobbies-container").append(list);
      }
    </script>
  </body>
</html>
